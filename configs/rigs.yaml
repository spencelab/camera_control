        command: "ros2 run triggerbox_ros2 triggerbox_host --device /dev/trig2 --ros-args -p default_fps:=100.0"
      - name: treadmill_host
        command: "ros2 run treadmill_control treadmill_host --ros-args -p enabled:=true -p auto_connect:=true -p status_hz:=2.0 -p query_speed_hz:=2.0"
      - name: cam1@cam1
        command: "ssh -T spencelab@cam1 'source /opt/ros/jazzy/setup.bash && source ~/ros2_ws/install/setup.bash && exec ros2 run cambuffer_recorder_ng cambuffer_recorder_ng --ros-args -r __node:=cam1 --params-file ~/ros2_ws/src/cambuffer_recorder_ng/config/ximea_raw8bayerGBRG_rolling_hwtrigger.yaml'"

      - name: cam2@cam2
        command: "ssh -T spencelab@cam2 'source /opt/ros/jazzy/setup.bash && source ~/ros2_ws/install/setup.bash && exec ros2 run cambuffer_recorder_ng cambuffer_recorder_ng --ros-args -r __node:=cam2 --params-file ~/ros2_ws/src/cambuffer_recorder_ng/config/ximea_raw8bayerGBRG_rolling_hwtrigger.yaml'"

      - name: cam3@cam3
        command: "ssh -T spencelab@cam3 'source /opt/ros/jazzy/setup.bash && source ~/ros2_ws/install/setup.bash && exec ros2 run cambuffer_recorder_ng cambuffer_recorder_ng --ros-args -r __node:=cam3 --params-file ~/ros2_ws/src/cambuffer_recorder_ng/config/ximea_raw8bayerGBRG_rolling_hwtrigger.yaml'"

      - name: cam4@cam4
        command: "ssh -T spencelab@cam4 'source /opt/ros/jazzy/setup.bash && source ~/ros2_ws/install/setup.bash && exec ros2 run cambuffer_recorder_ng cambuffer_recorder_ng --ros-args -r __node:=cam4 --params-file ~/ros2_ws/src/cambuffer_recorder_ng/config/ximea_raw8bayerGBRG_rolling_hwtrigger.yaml'"

    shutdown_commands:
      - name: disable_trigger_output
        command: 'timeout 5s ros2 service call /triggerbox_host/disable_output std_srvs/srv/Trigger "{}" || true'

      - name: kill_triggerbox_host
        command: "sleep 2; pkill -TERM -f '[t]riggerbox_host' || true; sleep 2; pkill -KILL -f '[t]riggerbox_host' || true"

      - name: shutdown_cam1
        command: "ssh -T spencelab@cam1 'source /opt/ros/jazzy/setup.bash && source ~/ros2_ws/install/setup.bash && timeout 10s ros2 lifecycle set /cam1 shutdown || true'"

      - name: shutdown_cam2
        command: "ssh -T spencelab@cam2 'source /opt/ros/jazzy/setup.bash && source ~/ros2_ws/install/setup.bash && timeout 10s ros2 lifecycle set /cam2 shutdown || true'"

      - name: shutdown_cam3
        command: "ssh -T spencelab@cam3 'source /opt/ros/jazzy/setup.bash && source ~/ros2_ws/install/setup.bash && timeout 10s ros2 lifecycle set /cam3 shutdown || true'"

      - name: shutdown_cam4

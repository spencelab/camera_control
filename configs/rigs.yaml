      - name: cam2@10.0.0.2
        command: "ssh -t spencelab@10.0.0.2 'ros2 run cambuffer_recorder_ng cambuffer_recorder_ng --ros-args -r __node:=cam2 --params-file ~/ros2_ws/src/cambuffer_recorder_ng/config/ximea_raw8mono_rolling_hwtrigger.yaml'"
    shutdown_commands:
      - name: disable_trigger_output

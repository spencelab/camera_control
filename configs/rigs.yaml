# camera_control rig presets
#
# Installed location:
#   camera_control/configs/rigs.yaml
#
# Override for testing:
#   export CAMERA_CONTROL_RIGS_YAML=/path/to/rigs.yaml
#
# Commands below intentionally preserve the original launch style:
# the GUI wraps each command with:
#   source /opt/ros/DISTRO/setup.bash && source ~/ros2_ws/install/setup.bash && ...

rigs:
  - key: spence_mac_vm_2fakecams_fake_treadmill
    label: spence_mac_vm_2fakecams_fake_treadmill
    description: "Multipass Ubuntu VM: two local fake cameras at 320x240, 1 FPS, plus fake treadmill control. No triggerbox."
    has_triggerbox: false
    telemetry:
      treadmill: required
      triggerbox: "off"
      camera_events: true
    configure_delay_ms: 4000
    discover_delay_ms: 6000
    camera_nodes: [cam1, cam2]
    processes:
      - name: cam1
        command: "ros2 run cambuffer_recorder_ng cambuffer_recorder_ng --ros-args -r __node:=cam1 -p backend:=fake -p width:=320 -p height:=240   -p fps:=1.0 -p output_path:=/home/spencelab/camera_sessions/fakecam1_vm_test.mp4"
      - name: cam2
        command: "ros2 run cambuffer_recorder_ng cambuffer_recorder_ng --ros-args -r __node:=cam2 -p backend:=fake -p width:=320 -p height:=240   -p fps:=1.0 -p output_path:=/home/spencelab/camera_sessions/fakecam2_vm_test.mp4"
      - name: treadmill_host
        command: "ros2 run treadmill_control treadmill_host --fake --ros-args -p enabled:=true -p auto_connect:=true"
    shutdown_commands:
      - name: shutdown_cam1
        command: "timeout 10s ros2 lifecycle set /cam1 shutdown || true"
      - name: shutdown_cam2
        command: "timeout 10s ros2 lifecycle set /cam2 shutdown || true"
      - name: shutdown_fake_treadmill
        command: "pkill -INT -f '[t]readmill_control.*treadmill_host' || true"

  - key: gavin_vm_barebones_2cams_tbox
    label: gavin_vm_barebones_2cams_tbox
    description: "Original barebones launcher: local triggerbox_host plus local cam1/cam2."
    has_triggerbox: true
    telemetry:
      treadmill: "off"
      triggerbox: required
      camera_events: true
    configure_delay_ms: 4000
    discover_delay_ms: 6000
    camera_nodes: [cam1, cam2]
    processes:
      - name: triggerbox_host
        command: "ros2 run triggerbox_ros2 triggerbox_host"
      - name: cam1
        command: "ros2 run cambuffer_recorder_ng cambuffer_recorder_ng --ros-args -r __node:=cam1 --params-file ~/ros2_ws/src/cambuffer_recorder_ng/config/ximea_raw8mono_rolling_hwtrigger.yaml"
      - name: cam2
        command: "ros2 run cambuffer_recorder_ng cambuffer_recorder_ng --ros-args -r __node:=cam2 --params-file ~/ros2_ws/src/cambuffer_recorder_ng/config/ximea_raw8mono_rolling_hwtrigger.yaml"
    shutdown_commands:
      - name: disable_trigger_output
        command: 'timeout 5s ros2 service call /triggerbox_host/disable_output std_srvs/srv/Trigger "{}" || true'
      - name: shutdown_cam1
        command: "timeout 10s ros2 lifecycle set /cam1 shutdown || true"
      - name: shutdown_cam2
        command: "timeout 10s ros2 lifecycle set /cam2 shutdown || true"
      - name: kill_triggerbox_host
        command: "sleep 2; pkill -TERM -f '[t]riggerbox_host' || true; sleep 2; pkill -KILL -f '[t]riggerbox_host' || true"

  - key: camdev_local_1cam
    label: camdev_local_1cam
    description: "Camdev only: launch local cam1. No triggerbox host."
    has_triggerbox: false
    telemetry:
      treadmill: "off"
      triggerbox: "off"
      camera_events: true
    configure_delay_ms: 4000
    discover_delay_ms: 6000
    camera_nodes: [cam1]
    processes:
      - name: cam1
        command: "ros2 run cambuffer_recorder_ng cambuffer_recorder_ng --ros-args -r __node:=cam1 --params-file ~/ros2_ws/src/cambuffer_recorder_ng/config/ximea_raw8mono_rolling_hwtrigger.yaml"
    shutdown_commands:
      - name: shutdown_cam1
        command: "timeout 10s ros2 lifecycle set /cam1 shutdown || true"

  - key: camdev_local_1cam_tbox
    label: camdev_local_1cam_tbox
    description: "Camdev only: local triggerbox_host plus local cam1."
    has_triggerbox: true
    telemetry:
      treadmill: "off"
      triggerbox: required
      camera_events: true
    configure_delay_ms: 4000
    discover_delay_ms: 6000
    camera_nodes: [cam1]
    processes:

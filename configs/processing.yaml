processing:
  local_sessions_root: "/home/spencelab/camera_sessions"
  remote_sessions_root: "/home/spencelab/camera_sessions"

  cameras:
    - cam1
    - cam2
    - cam3
    - cam4
    - cam5

  processed_subdir: "processed"
  thumbnails_subdir: "thumbnails"
  manifest_name: "processing_manifest.tsv"

  conversion:
    fps: 5.0
    r_gain: 1.23
    g_gain: 1.00
    b_gain: 1.60
    gamma: 1.0
    audit_threshold_frames: 1.5

  upload:
    host: "gpu2"
    user: "spencelab"
    root: "/zfstank3/storage/camera_sessions_uploads"
    verify: "size"
    max_parallel_uploads: 1

  rosbag:
    subdir: "rosbag"
    upload_from: "tmill"
